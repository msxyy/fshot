[package]
name = "fshot"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Lightweight screenshot + annotation tool for Windows"
license = "MIT"

[[bin]]
name = "fshot"
path = "src/main.rs"

[dependencies]
# --- UI / 窗口 ---
egui = "0.29"
egui-winit = "0.29"
egui-wgpu = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
winit = "0.30"
wgpu = "22"
pollster = "0.4"
ab_glyph = "0.2"

# --- 托盘 / 全局热键 ---
tray-icon = "0.19"
global-hotkey = "0.6"

# --- 截图 ---
xcap = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# --- 剪贴板 ---
arboard = { version = "3.4", features = ["image-data"] }

# --- 序列化 / 配置 ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

# --- 日志 / 错误 ---
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"